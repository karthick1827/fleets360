# DO NOT EDIT -- overwritten on every update.
#
# Legacy override surface for acl-editorial-review, which is deprecated and
# forwards to acl-review's `structure` and `prose` lenses. These keys exist
# only so overrides written against the old skill keep resolving: the shim
# resolves them here and passes them to acl-review as pre-resolved values,
# which acl-review honors verbatim over its own.
#
# Every field is documented in acl-review's customize.toml, which is where
# new customization belongs. Defaults are empty here so the shim contributes
# nothing of its own — an unset key falls through to acl-review's default.
#
# Override files (not edited here):
#   {project-root}/_acl/custom/acl-editorial-review.toml         (team)
#   {project-root}/_acl/custom/acl-editorial-review.user.toml    (personal)
#
# Overrides merge per ACL structural rules: scalars win, arrays append.

[workflow]

activation_steps_prepend = []
activation_steps_append = []
persistent_facts = []
review_guidance = []
on_complete = ""
output_preferences = ""
reader_type = ""
style_guide = ""

# Where the findings table lands; forwarded as acl-review's report path.
review_output_path = ""
