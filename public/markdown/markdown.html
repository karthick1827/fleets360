      window.__ACL_EMBEDDED_FILES__ = [{"id":"_acl-output_e2e-testing_md","folderPath":"_acl-output","filename":"e2e-testing.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T08:22:27.737Z","content":"---\ntitle: Dummy e2e testing\ntype: testing\ncreated: 2026-09-22\nstatus: Approved\n---\n\n# Dummy e2e testing\n\nPlaceholder Validate & Release document so Phase 4 appears on the dashboards.\n\nReplace this file with real e2e or testing notes when they exist.\n"},{"id":"_acl-output_implementation-artifacts_spec-1-2-forgot-password-entry_md","folderPath":"_acl-output/implementation-artifacts","filename":"spec-1-2-forgot-password-entry.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.326Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-16T07:12:15.284Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\ntitle: Forgot password entry and MVP shells (Stories 1.2, 3.3, 1.1 validation)\r\ntype: feature\r\ncreated: 2026-09-16\r\nstory_key: 1-2-forgot-password-entry\r\nbaseline_commit: NO_VCS\r\ncontext:\r\n  - ../../../_acl-output/planning-artifacts/epics.md\r\n---\r\n\r\n<frozen-after-approval reason=\"human-owned intent — do not modify unless human renegotiates\">\r\n\r\n## Intent\r\n\r\n**Problem:** Forgot password was a generic placeholder; domain routes lacked descriptive shells; Login skipped browser validation feedback on empty submit.\r\n\r\n**Approach:** Dedicated Forgot Password page with auth-layer stub; domain copy in App route table; `checkValidity` on Login form.\r\n\r\n## Boundaries & Constraints\r\n\r\n**Always:** Recovery logic in `src/auth/`; guest-only `/forgot-password`; generic success copy (no account enumeration).\r\n\r\n**Ask First:** Real reset API contract.\r\n\r\n**Never:** Email-specific failure messages that leak account existence.\r\n\r\n</frozen-after-approval>\r\n\r\n## Code Map\r\n\r\n- `src/pages/ForgotPassword.jsx` + `.css` — FR-3 UI\r\n- `src/auth/requestPasswordReset.js` — stub reset request\r\n- `src/App.jsx` — route + domain shell copy\r\n- `src/pages/Login.jsx` — HTML5 validation on submit\r\n\r\n## Tasks & Acceptance\r\n\r\n**Execution:**\r\n- [x] `src/auth/requestPasswordReset.js` — stub\r\n- [x] `src/pages/ForgotPassword.jsx` — page + back link\r\n- [x] `src/App.jsx` — wire route and domain descriptions\r\n- [x] `src/pages/Login.jsx` — validation feedback\r\n\r\n**Acceptance Criteria:**\r\n- Given `/login`, when Forgot Password is activated, then `/forgot-password` explains next steps\r\n- Given authenticated user on `/devices`, when page loads, then title, description, back link appear\r\n\r\n## Verification\r\n\r\n**Commands:**\r\n- `npm run build` — expected: success\r\n\r\n## Spec Change Log\r\n\r\n- 2026-09-16: Post-approval polish — legal URL config (`src/config/legal.js`), hub stacks below 900px; sprint stories 1.1–3.3 marked done.\r\n\r\n## Suggested Review Order\r\n\r\n**Forgot password flow**\r\n\r\n- Guest recovery page delegates to auth stub, not inline fetch.\r\n  [`ForgotPassword.jsx:27`](../../../src/pages/ForgotPassword.jsx#L27)\r\n\r\n**Domain shells**\r\n\r\n- Route table supplies per-module copy for placeholder shells.\r\n  [`App.jsx:8`](../../../src/App.jsx#L8)\r\n\r\n**Login compliance**\r\n\r\n- Legal link resolves via env-backed URL for FR-4.\r\n  [`legal.js:2`](../../../src/config/legal.js#L2)\r\n\r\n**Responsive hub**\r\n\r\n- Cards stack in a column under 900px per UX spine.\r\n  [`Landing.css:137`](../../../src/pages/Landing.css#L137)\r\n"},{"id":"_acl-output_implementation-artifacts_spec-3-2-auth-module-and-session-guard_md","folderPath":"_acl-output/implementation-artifacts","filename":"spec-3-2-auth-module-and-session-guard.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.371Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-16T07:09:42.913Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\ntitle: Auth module and session guard (Stories 3.2, 1.3, 1.4, 2.3)\r\ntype: feature\r\ncreated: 2026-09-16\r\nstory_key: 3-2-auth-module-and-session-guard\r\nbaseline_commit: pending\r\ncontext:\r\n  - ../../../_acl-output/planning-artifacts/architecture/architecture-fleets360-2026-09-16/ARCHITECTURE-SPINE.md\r\n  - ../../../_acl-output/planning-artifacts/epics.md\r\n---\r\n\r\n<frozen-after-approval reason=\"human-owned intent — do not modify unless human renegotiates\">\r\n\r\n## Intent\r\n\r\n**Problem:** Hub and domain routes were reachable without a session; Login navigated to `/home` without establishing auth per AD-2/AD-3.\r\n\r\n**Approach:** Add `src/auth/` session + login stub and router guards; Login calls auth module instead of bare `navigate`.\r\n\r\n## Boundaries & Constraints\r\n\r\n**Always:** No passwords in URLs/logs; generic credential error on Login (AD-7); guards on `/home`, `/devices`, `/sites`, `/users`; dev session flag in `sessionStorage` only until httpOnly API exists.\r\n\r\n**Ask First:** Real auth API base URL and cookie contract.\r\n\r\n**Never:** Long-lived tokens in `localStorage`; fetch/token logic inside `Login.jsx` beyond calling `loginUser`.\r\n\r\n## I/O & Edge-Case Matrix\r\n\r\n| Scenario | Input / State | Expected Output / Behavior | Error Handling |\r\n|----------|--------------|---------------------------|----------------|\r\n| Valid login | Valid email + password | Session established; redirect to `/home` or `from` | N/A |\r\n| Invalid login | Bad email or empty password | Stay on Login; generic error | Single message |\r\n| No session | Visit `/home` | Redirect to `/login` | N/A |\r\n| Expired session | `exp` past TTL on refresh | Redirect to `/login` with expiry message | Clear session |\r\n| Authenticated guest | Visit `/login` | Redirect to `/home` | N/A |\r\n\r\n</frozen-after-approval>\r\n\r\n## Code Map\r\n\r\n- `src/App.jsx` — wrap protected routes with `RequireAuth`, login with `GuestOnly`\r\n- `src/pages/Login.jsx` — call `loginUser`, show errors and session-expired flash\r\n- `src/auth/session.js` — sessionStorage expiry record (dev stub)\r\n- `src/auth/loginUser.js` — dev stub login; `VITE_AUTH_STUB=false` blocks until API wired\r\n- `src/api/authClient.js` — `VITE_AUTH_API_URL` placeholder for production\r\n\r\n## Tasks & Acceptance\r\n\r\n**Execution:**\r\n- [x] `src/auth/session.js` — session TTL helpers\r\n- [x] `src/auth/loginUser.js` — stub login + uniform errors\r\n- [x] `src/auth/RequireAuth.jsx` / `GuestOnly.jsx` — route guards\r\n- [x] `src/App.jsx` — apply guards\r\n- [x] `src/pages/Login.jsx` — wire auth + messaging\r\n\r\n**Acceptance Criteria:**\r\n- Given no session, when visiting `/home`, then redirect to `/login`\r\n- Given valid dev credentials, when submitting Login, then land on `/home` with session\r\n- Given expired session, when refreshing `/home`, then redirect to `/login` with expiry notice\r\n\r\n## Verification\r\n\r\n**Commands:**\r\n- `npm run build` — expected: success\r\n\r\n## Spec Change Log\r\n"},{"id":"_acl-output_implementation-artifacts_spec-4-1-authenticated-layout-navbar_md","folderPath":"_acl-output/implementation-artifacts","filename":"spec-4-1-authenticated-layout-navbar.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.374Z","content":"---\r\nstatus: Approved\r\ntitle: Authenticated layout and app navbar (Story 4.1)\r\ntype: feature\r\ncreated: 2026-09-16\r\nstory_key: 4-1-authenticated-layout-navbar\r\nbaseline_commit: NO_VCS\r\ncontext:\r\n  - ../../../_acl-output/planning-artifacts/epics.md\r\n---\r\n\r\n<frozen-after-approval reason=\"human-owned intent — do not modify unless human renegotiates\">\r\n\r\n## Intent\r\n\r\n**Problem:** Protected pages had no shared chrome for account actions.\r\n\r\n**Approach:** Render `AppNavbar` inside `AuthenticatedLayout` above `<Outlet />`; guest routes stay outside this layout.\r\n\r\n## Boundaries & Constraints\r\n\r\n**Always:** Navbar only under `RequireAuth` + `AuthenticatedLayout`. Sticky top bar using fleet tokens.\r\n\r\n**Never:** Import navbar from `Login` or `ForgotPassword`.\r\n\r\n</frozen-after-approval>\r\n\r\n## Code Map\r\n\r\n- `src/layouts/AuthenticatedLayout.jsx` — shell + outlet\r\n- `src/layouts/AuthenticatedLayout.css` — flex column layout\r\n- `src/components/AppNavbar.jsx` + `.css` — brand link to `/home`\r\n- `src/App.jsx` — protected route group wraps layout\r\n\r\n## Tasks & Acceptance\r\n\r\n**Execution:**\r\n- [x] `AuthenticatedLayout` renders navbar + main outlet\r\n- [x] Protected routes nested under layout in `App.jsx`\r\n- [x] Guest routes exclude layout\r\n\r\n**Acceptance Criteria:**\r\n- Given authenticated on `/home`, `/devices`, `/sites`, or `/users`, when page loads, then navbar appears above content\r\n- Given `/login` or `/forgot-password`, when page loads, then navbar is absent\r\n- Given navigation between protected routes, when routing, then navbar persists (layout not remounted)\r\n\r\n## Verification\r\n\r\n**Commands:**\r\n- `npm run build` — expected: success\r\n\r\n## Spec Change Log\r\n\r\n- 2026-09-16: Story 4.1 implemented and verified\r\n"},{"id":"_acl-output_implementation-artifacts_spec-4-2-profile-menu_md","folderPath":"_acl-output/implementation-artifacts","filename":"spec-4-2-profile-menu.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.374Z","content":"---\r\nstatus: Approved\r\ntitle: Profile menu UI and accessibility (Story 4.2)\r\ntype: feature\r\ncreated: 2026-09-16\r\nstory_key: 4-2-profile-menu\r\nbaseline_commit: NO_VCS\r\ncontext:\r\n  - ../../../_acl-output/planning-artifacts/epics.md\r\n---\r\n\r\n<frozen-after-approval reason=\"human-owned intent — do not modify unless human renegotiates\">\r\n\r\n## Intent\r\n\r\n**Problem:** No entry point for settings, theme, or sign out from the hub.\r\n\r\n**Approach:** `ProfileMenu` in navbar with disclosure pattern; keyboard support per NFR-6.\r\n\r\n## Boundaries & Constraints\r\n\r\n**Always:** Menu actions delegate to router, `theme.js`, or `signOut()` — no inline session storage.\r\n\r\n**Never:** Hover-only activation.\r\n\r\n</frozen-after-approval>\r\n\r\n## Code Map\r\n\r\n- `src/components/ProfileMenu.jsx` + `.css` — menu UI and handlers\r\n- `src/components/AppNavbar.jsx` — hosts `ProfileMenu`\r\n\r\n## Tasks & Acceptance\r\n\r\n**Execution:**\r\n- [x] Profile trigger with `aria-haspopup`, `aria-expanded`\r\n- [x] Menu items: Profile settings, Theme, Sign out\r\n- [x] Escape and outside click close menu; focus returns to trigger\r\n- [x] Arrow Up/Down between menu items\r\n\r\n**Acceptance Criteria:**\r\n- Given authenticated, when profile control activated, then three menu items appear\r\n- Given open menu, when Escape or outside click, then menu closes and focus on trigger\r\n- Given open menu, when keyboard navigation, then each item reachable and activatable\r\n\r\n## Verification\r\n\r\n**Commands:**\r\n- `npm run build` — expected: success\r\n\r\n## Spec Change Log\r\n\r\n- 2026-09-16: Story 4.2 implemented and verified\r\n"},{"id":"_acl-output_implementation-artifacts_spec-4-3-profile-settings-page_md","folderPath":"_acl-output/implementation-artifacts","filename":"spec-4-3-profile-settings-page.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.326Z","content":"---\r\nstatus: Approved\r\ntitle: Profile settings page (Story 4.3)\r\ntype: feature\r\ncreated: 2026-09-16\r\nstory_key: 4-3-profile-settings-page\r\nbaseline_commit: NO_VCS\r\ncontext:\r\n  - ../../../_acl-output/planning-artifacts/epics.md\r\n---\r\n\r\n<frozen-after-approval reason=\"human-owned intent — do not modify unless human renegotiates\">\r\n\r\n## Intent\r\n\r\n**Problem:** Operators cannot confirm which account is signed in.\r\n\r\n**Approach:** Protected `/profile` page reads identity from `getSessionIdentity()`; MVP read-only.\r\n\r\n## Boundaries & Constraints\r\n\r\n**Always:** Route behind `RequireAuth`; email from session record set at login.\r\n\r\n**Never:** Password fields on profile page in MVP.\r\n\r\n</frozen-after-approval>\r\n\r\n## Code Map\r\n\r\n- `src/pages/ProfileSettings.jsx` + `.css` — identity display + theme section\r\n- `src/App.jsx` — `/profile` route inside authenticated group\r\n- `src/auth/session.js` — `establishSession({ email })`, `getSessionIdentity()`\r\n- `src/auth/loginUser.js` — passes email into session on stub login\r\n\r\n## Tasks & Acceptance\r\n\r\n**Execution:**\r\n- [x] `/profile` route registered under auth layout\r\n- [x] Page shows email from session\r\n- [x] `RequireAuth` redirects unauthenticated visitors to `/login`\r\n\r\n**Acceptance Criteria:**\r\n- Given Profile settings from menu, when navigation completes, then URL is `/profile` with session\r\n- Given on `/profile`, when page renders, then signed-in email shown (no password fields)\r\n- Given no session, when visiting `/profile`, then redirect to `/login`\r\n\r\n## Verification\r\n\r\n**Commands:**\r\n- `npm run build` — expected: success\r\n\r\n## Spec Change Log\r\n\r\n- 2026-09-16: Story 4.3 implemented and verified\r\n"},{"id":"_acl-output_implementation-artifacts_spec-4-4-theme-preference_md","folderPath":"_acl-output/implementation-artifacts","filename":"spec-4-4-theme-preference.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.360Z","content":"---\r\nstatus: Approved\r\ntitle: Theme preference (Story 4.4)\r\ntype: feature\r\ncreated: 2026-09-16\r\nstory_key: 4-4-theme-preference\r\nbaseline_commit: NO_VCS\r\ncontext:\r\n  - ../../../_acl-output/planning-artifacts/epics.md\r\n---\r\n\r\n<frozen-after-approval reason=\"human-owned intent — do not modify unless human renegotiates\">\r\n\r\n## Intent\r\n\r\n**Problem:** No user-controlled light/dark preference across authenticated pages.\r\n\r\n**Approach:** `src/theme/theme.js` persists `fleet360.theme` (`light` | `dark` | `system`); apply via `data-theme` on `documentElement`.\r\n\r\n## Boundaries & Constraints\r\n\r\n**Always:** Theme preference only in `localStorage`; session/auth stays in `sessionStorage` per AD-3.\r\n\r\n**Never:** Store passwords or tokens in `localStorage`.\r\n\r\n</frozen-after-approval>\r\n\r\n## Code Map\r\n\r\n- `src/theme/theme.js` — get/set/cycle/apply/init\r\n- `src/styles/fleet-tokens.css` — `:root[data-theme='dark']` overrides\r\n- `src/main.jsx` — `initTheme()` on boot\r\n- `src/components/ProfileMenu.jsx` — cycle from menu\r\n- `src/pages/ProfileSettings.jsx` — explicit theme buttons\r\n\r\n## Tasks & Acceptance\r\n\r\n**Execution:**\r\n- [x] Theme module with `fleet360.theme` key\r\n- [x] Dark token overrides in CSS\r\n- [x] Menu cycle + profile page buttons\r\n- [x] Boot-time apply in `main.jsx`\r\n\r\n**Acceptance Criteria:**\r\n- Given authenticated, when theme changed from menu or profile, then UI updates via tokens immediately\r\n- Given theme set, when page reload, then same preference applied from localStorage\r\n- Given sign-in, when session stored, then no auth secret in localStorage\r\n\r\n## Verification\r\n\r\n**Commands:**\r\n- `npm run build` — expected: success\r\n\r\n## Spec Change Log\r\n\r\n- 2026-09-16: Story 4.4 implemented and verified\r\n"},{"id":"_acl-output_implementation-artifacts_spec-4-5-sign-out_md","folderPath":"_acl-output/implementation-artifacts","filename":"spec-4-5-sign-out.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.326Z","content":"---\r\nstatus: Approved\r\ntitle: Sign out (Story 4.5)\r\ntype: feature\r\ncreated: 2026-09-16\r\nstory_key: 4-5-sign-out\r\nbaseline_commit: NO_VCS\r\ncontext:\r\n  - ../../../_acl-output/planning-artifacts/epics.md\r\n---\r\n\r\n<frozen-after-approval reason=\"human-owned intent — do not modify unless human renegotiates\">\r\n\r\n## Intent\r\n\r\n**Problem:** No explicit sign-out from the authenticated shell.\r\n\r\n**Approach:** `signOut()` in `src/auth/` clears session; menu navigates to `/login` with `replace: true`.\r\n\r\n## Boundaries & Constraints\r\n\r\n**Always:** Sign out logic in auth module; guards continue to block protected routes.\r\n\r\n**Never:** Leave session record in `sessionStorage` after sign out.\r\n\r\n</frozen-after-approval>\r\n\r\n## Code Map\r\n\r\n- `src/auth/signOut.js` — calls `clearSession('logout')`\r\n- `src/auth/session.js` — `clearSession`, `hasValidSession`\r\n- `src/components/ProfileMenu.jsx` — `handleSignOut`\r\n- `src/auth/RequireAuth.jsx` — redirect when session missing\r\n\r\n## Tasks & Acceptance\r\n\r\n**Execution:**\r\n- [x] `signOut()` exported from auth layer\r\n- [x] Profile menu sign out clears session and routes to login\r\n- [x] No confirmation dialog for MVP\r\n\r\n**Acceptance Criteria:**\r\n- Given authenticated, when Sign out chosen, then session cleared and land on `/login`\r\n- Given signed out, when visiting protected URLs, then redirect to `/login`\r\n- Given open menu, when Sign out activated, then single action (no extra confirm)\r\n\r\n## Verification\r\n\r\n**Commands:**\r\n- `npm run build` — expected: success\r\n\r\n## Spec Change Log\r\n\r\n- 2026-09-16: Story 4.5 implemented and verified\r\n"},{"id":"_acl-output_implementation-artifacts_spec-4_6-forgot-password-entry_copy_md","folderPath":"_acl-output/implementation-artifacts","filename":"spec-4.6-forgot-password-entry copy.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-24T05:27:50.414Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-16T07:12:15.284Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\ntitle: Forgot password entry and MVP shells (Stories 1.2, 3.3, 1.1 validation)\r\ntype: feature\r\ncreated: 2026-09-16\r\nstory_key: 1-2-forgot-password-entry\r\nbaseline_commit: NO_VCS\r\ncontext:\r\n  - ../../../_acl-output/planning-artifacts/epics.md\r\n---\r\n\r\n<frozen-after-approval reason=\"human-owned intent — do not modify unless human renegotiates\">\r\n\r\n## Intent\r\n\r\n**Problem:** Forgot password was a generic placeholder; domain routes lacked descriptive shells; Login skipped browser validation feedback on empty submit.\r\n\r\n**Approach:** Dedicated Forgot Password page with auth-layer stub; domain copy in App route table; `checkValidity` on Login form.\r\n\r\n## Boundaries & Constraints\r\n\r\n**Always:** Recovery logic in `src/auth/`; guest-only `/forgot-password`; generic success copy (no account enumeration).\r\n\r\n**Ask First:** Real reset API contract.\r\n\r\n**Never:** Email-specific failure messages that leak account existence.\r\n\r\n</frozen-after-approval>\r\n\r\n## Code Map\r\n\r\n- `src/pages/ForgotPassword.jsx` + `.css` — FR-3 UI\r\n- `src/auth/requestPasswordReset.js` — stub reset request\r\n- `src/App.jsx` — route + domain shell copy\r\n- `src/pages/Login.jsx` — HTML5 validation on submit\r\n\r\n## Tasks & Acceptance\r\n\r\n**Execution:**\r\n- [x] `src/auth/requestPasswordReset.js` — stub\r\n- [x] `src/pages/ForgotPassword.jsx` — page + back link\r\n- [x] `src/App.jsx` — wire route and domain descriptions\r\n- [x] `src/pages/Login.jsx` — validation feedback\r\n\r\n**Acceptance Criteria:**\r\n- Given `/login`, when Forgot Password is activated, then `/forgot-password` explains next steps\r\n- Given authenticated user on `/devices`, when page loads, then title, description, back link appear\r\n\r\n## Verification\r\n\r\n**Commands:**\r\n- `npm run build` — expected: success\r\n\r\n## Spec Change Log\r\n\r\n- 2026-09-16: Post-approval polish — legal URL config (`src/config/legal.js`), hub stacks below 900px; sprint stories 1.1–3.3 marked done.\r\n\r\n## Suggested Review Order\r\n\r\n**Forgot password flow**\r\n\r\n- Guest recovery page delegates to auth stub, not inline fetch.\r\n  [`ForgotPassword.jsx:27`](../../../src/pages/ForgotPassword.jsx#L27)\r\n\r\n**Domain shells**\r\n\r\n- Route table supplies per-module copy for placeholder shells.\r\n  [`App.jsx:8`](../../../src/App.jsx#L8)\r\n\r\n**Login compliance**\r\n\r\n- Legal link resolves via env-backed URL for FR-4.\r\n  [`legal.js:2`](../../../src/config/legal.js#L2)\r\n\r\n**Responsive hub**\r\n\r\n- Cards stack in a column under 900px per UX spine.\r\n  [`Landing.css:137`](../../../src/pages/Landing.css#L137)\r\n"},{"id":"_acl-output_planning-artifacts_architecture_architecture-fleets360-2026-09-16_ARCHITECTURE-SPINE_md","folderPath":"_acl-output/planning-artifacts/architecture/architecture-fleets360-2026-09-16","filename":"ARCHITECTURE-SPINE.md","status":"In Review","projectType":null,"tier":null,"updatedAt":"2026-09-24T05:20:59.284Z","content":"---\nstatus: In Review\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-24T05:20:59.260Z\ngate_signature: ACL-STUDIO-APPROVAL-IN-REVIEW\nname: Fleet 360\ntype: architecture-spine\npurpose: build-substrate\naltitude: feature\nparadigm: layered-spa\nscope: Login, Landing hub, authenticated app chrome (navbar/profile), route shells (MVP)\ncreated: \"2026-09-16\"\nupdated: \"2026-09-16\"\nbinds:\n  - FR-1\n  - FR-2\n  - FR-3\n  - FR-4\n  - FR-5\n  - FR-6\n  - FR-7\n  - FR-8\n  - FR-9\n  - FR-10\n  - FR-11\n  - FR-12\n  - FR-13\nsources:\n  - _acl-output/planning-artifacts/prds/prd-fleets360-2026-09-16/prd.md\n  - _acl-output/planning-artifacts/ux-designs/ux-fleets360-2026-09-16/EXPERIENCE.md\n  - _acl-output/planning-artifacts/ux-designs/ux-fleets360-2026-09-16/DESIGN.md\ncompanions: []\n---\n\n# Architecture Spine — Fleet 360\n\n## Design Paradigm\n\n**Layered single-page application (SPA)** on Vite + React:\n\n| Layer | Location | Responsibility |\n| --- | --- | --- |\n| Presentation | `src/pages/*`, co-located `*.css` | Figma-aligned UI, local form state |\n| Application | `src/App.jsx`, `src/layouts/*`, `src/auth/*`, `src/api/*` | Navigation, session gate, chrome, use-cases |\n| Shared UI chrome | `src/components/` (navbar, profile menu) | Authenticated shell only; no auth secrets |\n| Preferences | `src/theme/` | Theme resolution + persistence (non-secret) |\n| Design tokens | `src/styles/fleet-tokens.css` | Colors, radii, fonts (`{DESIGN.md}` deltas) |\n| Static assets | `src/assets/fleet360/*` | Committed Figma exports (logos, icons, hero) |\n| Tooling | `vite.config.js` | Dev server, ACL markdown middleware (orthogonal to product runtime) |\n\n```mermaid\nflowchart TB\n  subgraph presentation [Presentation]\n    Login[Login page]\n    Landing[Landing page]\n    Shell[Domain shells]\n    Nav[App navbar + profile menu]\n    Profile[Profile settings page]\n  end\n  subgraph application [Application]\n    Router[React Router]\n    AuthLayout[AuthenticatedLayout]\n    AuthGate[Session gate]\n    ThemeMod[theme module]\n    AuthApi[Auth client]\n  end\n  subgraph infra [Infrastructure]\n    Bff[Auth API / BFF - TBD]\n  end\n  Login --> Router\n  Router --> AuthGate\n  AuthGate --> AuthLayout\n  AuthLayout --> Nav\n  AuthLayout --> Landing\n  AuthLayout --> Shell\n  AuthLayout --> Profile\n  Nav --> ThemeMod\n  AuthGate --> AuthApi\n  AuthApi --> Bff\n```\n\n## Invariants & Rules\n\n### AD-1 — Canonical routes [ADOPTED]\n\n- **Binds:** FR-2, FR-5, FR-6, EXPERIENCE.md IA\n- **Prevents:** Duplicate or ambiguous URLs for the same screen\n- **Rule:** Public `/login`, `/forgot-password`. Post-auth hub at `/home`. Profile settings at `/profile`. Domain shells at `/devices`, `/sites`, `/users`. `/` redirects to `/login`.\n\n### AD-2 — Session gate before hub [ADOPTED]\n\n- **Binds:** FR-2, FR-7, FR-9, FR-11, FR-13\n- **Prevents:** Unauthenticated access to Landing, chrome, profile, and domain routes\n- **Rule:** `/home`, `/profile`, `/devices`, `/sites`, `/users` require a valid session. Missing or expired session redirects to `/login` with optional flash message. Until backend exists, a minimal client session record is allowed only behind the auth stub and must be replaced before production.\n\n### AD-3 — Auth token storage\n\n- **Binds:** FR-2, PRD addendum security note\n- **Prevents:** Passwords or long-lived tokens in `localStorage` / plain JS globals\n- **Rule:** Prefer **httpOnly, Secure, SameSite** session cookie set by auth API. If bearer tokens are required, keep access token in memory; refresh via httpOnly cookie. Never persist passwords. **Theme preference** and other non-secret UI prefs may use `localStorage` (see AD-9). Session identity fields (e.g. email display) may live in the same `sessionStorage` session record as expiry — not in `localStorage`.\n\n### AD-4 — Presentation vs domain logic\n\n- **Binds:** all FRs at MVP\n- **Prevents:** API calls and session logic embedded in page components\n- **Rule:** Pages compose UI only. Auth and HTTP live in `src/auth/` and `src/api/`. Theme resolution lives in `src/theme/`. Router and guards live in `src/App.jsx` or `src/routes/`. Navbar/profile menu are presentational components; sign-out and session reads call `src/auth/` only (no inline `sessionStorage` in components).\n\n### AD-5 — Design fidelity and assets\n\n- **Binds:** FR-5, FR-8, DESIGN.md\n- **Prevents:** Re-drawn icons/logos diverging from Figma\n- **Rule:** Use committed files under `src/assets/fleet360/`. New screens import Figma via MCP export into that tree; document in UX `imports/figma-asset-manifest.md`.\n\n### AD-6 — Styling system\n\n- **Binds:** UX DESIGN tokens\n- **Prevents:** One-off hex values scattered without token linkage\n- **Rule:** Shared tokens in `fleet-tokens.css` (`--fleet-*`). Page-specific layout in page CSS files. No Tailwind unless AD is amended.\n\n### AD-7 — Error and loading shape (auth)\n\n- **Binds:** FR-2, FR-3\n- **Prevents:** Inconsistent auth failure UX\n- **Rule:** API errors map to `{ code, message }` at the client boundary; Login shows a single user-safe message for invalid credentials (no field-level leak).\n\n### AD-8 — Authenticated layout chrome [ADOPTED]\n\n- **Binds:** FR-9, FR-10\n- **Prevents:** Navbar duplicated per page or shown on guest routes\n- **Rule:** `AuthenticatedLayout` wraps all `RequireAuth` child routes. It renders **App navbar** (with profile control) above `<Outlet />`. Guest routes (`GuestOnly`) never import navbar components. Navbar is sticky/top-aligned; page content scrolls beneath.\n\n### AD-9 — Theme preference\n\n- **Binds:** FR-12, AD-3, AD-6\n- **Prevents:** Per-page theme hacks; storing credentials with theme\n- **Rule:** Canonical storage key `fleet360.theme` in `localStorage` with enum `light` | `dark` | `system`. Module `src/theme/` exposes `getTheme()`, `setTheme()`, `applyThemeToDocument()`, and optional `useTheme()` hook. Apply via `data-theme` on `document.documentElement` (or class) mapped to CSS variables in `fleet-tokens.css`. Login/Forgot Password may ignore stored theme or apply light-only until guest screens gain dark tokens — authenticated routes must honor preference.\n\n### AD-10 — Profile menu and settings route\n\n- **Binds:** FR-10, FR-11\n- **Prevents:** Profile actions scattered; modal-only settings with no URL\n- **Rule:** Profile dropdown component lives under `src/components/` (e.g. `ProfileMenu.jsx`). Menu items: **Profile settings** → navigate to `/profile`; **Theme** → cycles or toggles theme via AD-9 (may also offer control on profile page); **Sign out** → AD-11. `/profile` is a protected page (`pages/ProfileSettings.jsx`) showing signed-in email/label from `getSessionIdentity()` in `src/auth/session.js`. No password fields on this page in MVP.\n\n### AD-11 — Sign out\n\n- **Binds:** FR-13, AD-2, AD-3\n- **Prevents:** Partial logout leaving protected UI visible\n- **Rule:** `signOut()` in `src/auth/` calls `clearSession()` and returns; caller navigates to `/login` with `replace: true`. Optional reason `logout` for messaging. No auth artifacts in `localStorage` after sign out (theme key may remain).\n\n## Consistency Conventions\n\n| Concern | Convention |\n| --- | --- |\n| Naming (routes, files) | kebab URL segments; PascalCase page components (`Login.jsx`) |\n| Data & formats | ISO 8601 dates in APIs; user-facing copy per EXPERIENCE.md |\n| State & cross-cutting | React state + router for UI; server session for auth; theme via AD-9; env via `import.meta.env` |\n| Accessibility (chrome) | Profile button `aria-haspopup=\"menu\"`; menu keyboard per WAI-ARIA disclosure pattern |\n| Errors | User-safe messages on Login; log technical detail only in dev console |\n| Config | `VITE_*` for client-visible endpoints; secrets never in repo |\n\n## Stack\n\n| Name | Version |\n| --- | --- |\n| Node (dev) | 20+ LTS [ASSUMPTION: team standard] |\n| React | 19.2.x |\n| react-router-dom | 7.18.x |\n| Vite | 8.3.x |\n| oxlint | 1.81.x |\n| React Compiler (babel plugin) | 1.0.x |\n\nAuth API / IdP: **deferred** (see Deferred).\n\n## Structural Seed\n\n```text\nsrc/\n  main.jsx              # BrowserRouter root; bootstrap theme apply\n  App.jsx               # Route table + guards\n  layouts/\n    AuthenticatedLayout.jsx   # Navbar + Outlet\n  components/\n    AppNavbar.jsx + AppNavbar.css\n    ProfileMenu.jsx\n  index.css             # Global reset + token import\n  styles/\n    fleet-tokens.css    # + dark theme token overrides\n  pages/\n    Login.jsx + Login.css\n    Landing.jsx + Landing.css\n    ProfileSettings.jsx + ProfileSettings.css\n    Placeholder.jsx     # Shell pattern until domain modules exist\n  assets/fleet360/      # Figma exports\n  auth/                 # session, guards, loginUser, signOut\n  theme/                # AD-9 preference module\n  api/                  # fetch wrapper, auth endpoints\n```\n\n**Deployment (MVP):** static `dist/` from `vite build`; served by CDN or static host. Auth API hosted separately; CORS/cookie domain aligned with AD-3.\n\n## Capability → Architecture Map\n\n| Capability / FR | Lives in | Governed by |\n| --- | --- | --- |\n| Login form FR-1, FR-4 | `pages/Login` | AD-5, AD-6 |\n| Authenticate FR-2 | `auth/` + `api/` | AD-2, AD-3, AD-7 |\n| Forgot password FR-3 | `pages/Placeholder` → future `ForgotPassword` | AD-1, AD-4 |\n| Landing hub FR-5–FR-7 | `pages/Landing` | AD-1, AD-2, AD-5 |\n| ACL branding FR-8 | `Login` assets | AD-5 |\n| Devices / Sites / Users entry | `Placeholder` shells | AD-1, AD-4 |\n| App navbar FR-9 | `layouts/AuthenticatedLayout`, `components/AppNavbar` | AD-8 |\n| Profile menu FR-10 | `components/ProfileMenu` | AD-8, AD-10 |\n| Profile settings FR-11 | `pages/ProfileSettings`, `auth/session` identity | AD-1, AD-10 |\n| Theme FR-12 | `theme/*`, `fleet-tokens.css` | AD-9, AD-6 |\n| Sign out FR-13 | `auth/signOut` + router | AD-11, AD-2 |\n\n## Deferred\n\n| Item | Reason |\n| --- | --- |\n| SSO / enterprise IdP | Not in PRD v1 UI; revisit when pilot customer named |\n| Real Devices/Sites/Users modules | Out of MVP PRD scope |\n| RTU telemetry, dashboards | Phase 2+ Figma evidence only |\n| Shared component library (buttons, inputs) | Extract when third consumer beyond Login/navbar needs reuse |\n| Profile API (update name, avatar, locale) | FR-11 MVP is read-only identity |\n| Org-enforced theme / white-label skins | PRD non-goal |\n| E2E test stack | After auth API contract frozen |\n| i18n | English-only MVP per PRD |\n"},{"id":"_acl-output_planning-artifacts_briefs_brief-fleets360-2026-09-16_brief_md","folderPath":"_acl-output/planning-artifacts/briefs/brief-fleets360-2026-09-16","filename":"brief.md","status":"Approved","projectType":"greenfield","tier":null,"updatedAt":"2026-09-22T07:56:19.323Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-16T09:28:17.717Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\ntitle: \"Product Brief: Fleet 360\"\r\nproject_type: greenfield\r\ncreated: \"2026-09-16\"\r\nupdated: \"2026-09-16\"\r\n---\r\n\r\n# Product Brief: Fleet 360\r\n\r\n## Executive Summary\r\n\r\nFleet 360 is a web product for people who need a single place to see and control operational assets spread across locations. The Figma Login and Landing screens (Fleet-360_BK, Web canvas) define the first two beats of that experience: a credentialed gate, then a hub that names the work as **Devices**, **Sites**, and **Users**.\r\n\r\nThe landing promise is explicit: *complete visibility into your data, total control over your insights*, delivered as secure, real-time analytics. Login is not a marketing page; it is a controlled entry with email/password, password recovery, and legal acceptance, **Powered by ACL Digital**.\r\n\r\nThis brief exists to lock *what* those two screens are selling before PRD and UX work expand into the rest of the file (device cards, dashboards). The repo today is a React + Vite starter named `fleets360`; the product definition comes from design, not from implemented features.\r\n\r\n## The Problem\r\n\r\nOperators of distributed equipment cannot treat “the building,” “the box,” and “who is allowed to touch it” as one system. They hop between vendor portals, spreadsheets, and tribal knowledge. Landing copy attacks that split: devices need unified control and live insight; sites need hierarchy and instant oversight; users need roles *per site* with granular access.\r\n\r\nWithout a gated, shared web hub, the cost is delayed response, inconsistent access, and no single picture of what is running where. [ASSUMPTION] The pain is strongest for facility or fleet operators of HVAC/RTU-class equipment at named sites (inferred from later frames in the same Figma file, not from Login/Landing copy itself).\r\n\r\n## The Solution\r\n\r\nA **1366×768 web** application:\r\n\r\n1. **Login** — Email and password, Forgot Password, Login, and agreement to Terms and Privacy. Brand lockup plus ACL Digital attribution. Industrial plant imagery signals operations, not consumer SaaS.\r\n2. **Landing (post-welcome hub)** — “Welcome to Fleet 360” plus the visibility/control promise. Three equal entry cards:\r\n   - **Devices** — unified control and real-time insights; CTA *Get Started*\r\n   - **Sites** — site oversight and visual hierarchy; CTA *Learn More*\r\n   - **Users** — assign roles per site with granular access; CTA *Learn More*\r\n\r\nThe product is the hub those cards open into, not the cards alone.\r\n\r\n## What Makes This Different\r\n\r\nHonest from these two screens: the differentiator is **one authenticated surface for devices, sites, and users**, with site-scoped roles called out on the Users card. That is an execution and information-architecture bet, not a claimed technical moat.\r\n\r\nDo not treat leftover **TotalView / Early Access** layers in the file as live brand. Current visible brand is **Fleet 360** + **ACL Digital**. Nearby Rheem innovation copy sits off these frames; it is not part of this brief unless product confirms a customer-specific skin.\r\n\r\n## Who This Serves\r\n\r\n- **Primary:** Site or fleet operators who need to find devices, understand site structure, and act without waiting on a specialist. Success: they sign in and reach Devices, Sites, or Users in one hop.\r\n- **Secondary:** Admins who grant access. Success: they can assign roles per site from the Users path.\r\n- **Buyer / sponsor:** [ASSUMPTION] Operations or digital leadership at an industrial/OEM or facilities organization (ACL Digital as builder; end customer not named on these screens).\r\n\r\n## Success Criteria\r\n\r\n- Authenticated users reach the Landing hub after valid credentials; invalid credentials fail closed. [ASSUMPTION] email/password is sufficient for v1 (no SSO shown).\r\n- Landing makes Devices, Sites, and Users equally discoverable; each CTA routes to that domain.\r\n- Legal: Login cannot complete without the stated Terms and Privacy notice being present.\r\n- [ASSUMPTION] Time-to-first-hub under 30 seconds for a returning user; password reset is reachable without a support ticket.\r\n\r\n## Scope\r\n\r\n**In (from Login + Landing)**\r\n\r\n- Web login: email, password, forgot password, primary Login, Terms & Privacy, ACL Digital lockup\r\n- Authenticated landing hub: Fleet 360 welcome, value line, Devices / Sites / Users cards and CTAs\r\n- Navigation contract: Get Started (Devices) vs Learn More (Sites, Users) as designed\r\n\r\n**Out (unless a later brief/PRD expands)**\r\n\r\n- Dashboards, device cards, RTU telemetry, set points, maps, Excel export (present elsewhere in Figma)\r\n- Mobile/native, self-serve signup, SSO/MFA (not on these frames)\r\n- Reinstating TotalView “Early Access” branding\r\n\r\n## Vision\r\n\r\nIf the hub works, Fleet 360 becomes the default control plane for a customer’s sites: every device sits in a place, every person has a role there, and insight is live rather than exported. Login and Landing are the front door to that plane, not the product’s ceiling.\r\n\r\n## Feature addition: Authenticated app navbar with profile menu (2026-09-16)\r\n\r\n### Problem\r\n\r\nAfter sign-in, operators move between `/home`, `/devices`, `/sites`, and `/users` without a consistent chrome for account actions. There is no visible way to adjust preferences (e.g. theme), open profile-related settings, or sign out without clearing session manually.\r\n\r\n### Scope (in)\r\n\r\n- A **navbar** shown on all **authenticated** routes (Landing hub and domain placeholder shells), not on Login or Forgot Password.\r\n- **Profile dropdown** (avatar or user affordance) with three working actions:\r\n  - **Profile settings** — navigates to a dedicated settings view or modal where the operator can see/edit basic profile preferences (MVP: view signed-in identity and placeholder for future fields).\r\n  - **Theme** — toggles light/dark (or system) theme using existing design tokens; preference persists across refresh within AD-3 storage rules (no secrets in localStorage).\r\n  - **Sign out** — clears Session per `src/auth/` and redirects to `/login`.\r\n- Keyboard-accessible menu (open, navigate items, dismiss); focus management for the dropdown.\r\n- Visual treatment aligned with Fleet 360 tokens (`fleet-tokens.css`) and hub aesthetic.\r\n\r\n### Scope (out)\r\n\r\n- Full profile CRUD against a live user API (deferred until backend exists).\r\n- SSO, MFA, or org-level theme policies.\r\n- Navbar links to every future module beyond current AD-1 routes.\r\n\r\n### Success criteria\r\n\r\n- Authenticated users see the navbar on protected pages; unauthenticated users never do.\r\n- Each dropdown item performs its stated action without errors.\r\n- Sign out returns the user to Login and blocks return to protected routes until re-authentication.\r\n- Theme change is visible immediately and survives page reload for the same browser profile.\r\n"},{"id":"_acl-output_planning-artifacts_epics_md","folderPath":"_acl-output/planning-artifacts","filename":"epics.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.374Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-16T09:56:13.452Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\nstepsCompleted:\r\n  - step-01-validate-prerequisites\r\n  - step-02-design-epics\r\n  - step-03-create-stories\r\n  - step-04-final-validation\r\n  - step-02-design-epics-navbar-2026-09-16\r\n  - step-03-create-stories-navbar-2026-09-16\r\n  - step-04-final-validation-navbar-2026-09-16\r\ninputDocuments:\r\n  - _acl-output/planning-artifacts/prds/prd-fleets360-2026-09-16/prd.md\r\n  - _acl-output/planning-artifacts/prds/prd-fleets360-2026-09-16/addendum.md\r\n  - _acl-output/planning-artifacts/architecture/architecture-fleets360-2026-09-16/ARCHITECTURE-SPINE.md\r\n  - _acl-output/planning-artifacts/ux-designs/ux-fleets360-2026-09-16/DESIGN.md\r\n  - _acl-output/planning-artifacts/ux-designs/ux-fleets360-2026-09-16/EXPERIENCE.md\r\n  - _acl-output/planning-artifacts/ux-designs/ux-fleets360-2026-09-16/imports/figma-asset-manifest.md\r\n  - _acl-output/planning-artifacts/briefs/brief-fleets360-2026-09-16/brief.md\r\ncreated: \"2026-09-16\"\r\nupdated: \"2026-09-16\"\r\n---\r\n\r\n# fleets360 - Epic Breakdown\r\n\r\n## Overview\r\n\r\nThis document decomposes Fleet 360 **Login + Landing MVP** (PRD FR-1–FR-8) and **authenticated app chrome** (FR-9–FR-13), UX spines, and architecture AD-1–AD-11 into implementable epics and stories. Epics 1–3 and **Epic 4** (navbar, profile menu, theme, sign out) are implemented in the repo.\r\n\r\n## Requirements Inventory\r\n\r\n### Functional Requirements\r\n\r\nFR-1: Operator can enter email and password on Login with labeled fields (“Enter Email”, “Enter Password”); empty/invalid email blocked; password masked.\r\nFR-2: Valid credentials establish a Session and navigate to Landing; invalid credentials show generic error; unauthenticated users cannot reach protected routes; no password in URL/logs/plain storage.\r\nFR-3: Forgot Password link from Login opens recovery flow with keyboard focus and visible desktop layout; submission acknowledged or stub documented.\r\nFR-4: Login shows Terms & Privacy notice visible at 1366×768 without scroll; links resolve.\r\nFR-5: Authenticated Landing matches Figma `227:3884` hero, body, three cards (titles, descriptions, CTAs per design export).\r\nFR-6: Card CTAs navigate to `/devices`, `/sites`, `/users`; browser back preserves session.\r\nFR-7: Refresh on Landing keeps valid session; expired session redirects to Login.\r\nFR-8: Login shows “Powered by” ACL Digital attribution at 1366×768.\r\nFR-9: Authenticated App navbar on protected routes; absent on Login and Forgot Password.\r\nFR-10: Profile menu from navbar with Profile settings, Theme, and Sign out (keyboard accessible).\r\nFR-11: Profile settings view at `/profile` shows signed-in identity (MVP read-only).\r\nFR-12: Theme preference (light / dark / system) applies immediately and persists without storing credentials.\r\nFR-13: Sign out clears Session and redirects to Login; protected routes blocked afterward.\r\n\r\n### NonFunctional Requirements\r\n\r\nNFR-1 (SM-1 / security): HTTPS in deployed environments; auth API rate limiting assumed server-side.\r\nNFR-2 (accessibility): Login labels associated with inputs; focus order email → password → actions; hub icons decorative with adjacent text.\r\nNFR-3 (AD-3): No passwords or long-lived tokens in localStorage; prefer httpOnly session cookie when API exists.\r\nNFR-4 (AD-6): Shared design tokens in `fleet-tokens.css`; avoid one-off hex outside tokens.\r\nNFR-5 (AD-7): Auth failures use uniform `{ code, message }` at client boundary; user-safe Login messaging.\r\nNFR-6 (chrome a11y): Profile control and menu support keyboard operation (open, navigate, Escape dismiss, visible focus).\r\n\r\n### Additional Requirements\r\n\r\n- AD-1: Canonical routes `/login`, `/home`, `/profile`, `/devices`, `/sites`, `/users`, `/forgot-password`; `/` → `/login`.\r\n- AD-2: Session gate on `/home`, `/profile`, and domain routes; redirect to `/login` when missing/expired.\r\n- AD-8: `AuthenticatedLayout` renders navbar + `<Outlet />`; guest routes exclude chrome.\r\n- AD-9: Theme key `fleet360.theme` in `localStorage` (`light` | `dark` | `system`).\r\n- AD-10: `ProfileMenu` component; profile settings page at `/profile`.\r\n- AD-11: `signOut()` in `src/auth/` clears session; navigate to `/login` with replace.\r\n- AD-4: Auth/API logic in `src/auth/` and `src/api/`, not inside page components.\r\n- AD-5: Visual assets only from `src/assets/fleet360/` per Figma manifest.\r\n- Stack: React 19, Vite 8, react-router-dom 7.x (ratified in spine).\r\n- Static deploy: `vite build` → `dist/`; auth API hosted separately when introduced.\r\n\r\n### UX Design Requirements\r\n\r\nUX-DR1: Implement Login visual per Figma `1228:11322` using committed hero, logos, gradient, and form styling tokens.\r\nUX-DR2: Implement Landing per Figma `227:3884` — color wordmark, welcome typography (Inter + Roboto), slate hub band `#515D6D`.\r\nUX-DR3: Hub uses exported 48×48 SVGs for Devices, Sites, Users (no redrawn icons).\r\nUX-DR4: Primary buttons use `--fleet-primary` (#E50026); inputs use `--fleet-input-border`.\r\nUX-DR5: Desktop reference 1366×768; hub cards stack below 900px width (EXPERIENCE responsive note).\r\nUX-DR6: Microcopy matches EXPERIENCE.md (legal line, card descriptions, CTA labels from design export).\r\n\r\n### FR Coverage Map\r\n\r\n| FR | Epic | Story |\r\n| --- | --- | --- |\r\n| FR-1 | 1 | 1.1 |\r\n| FR-2 | 1 | 1.3, 1.4 |\r\n| FR-3 | 1 | 1.2 |\r\n| FR-4 | 1 | 1.1 |\r\n| FR-8 | 1 | 1.1 |\r\n| FR-5 | 2 | 2.1 |\r\n| FR-6 | 2 | 2.2 |\r\n| FR-7 | 1, 2 | 1.4, 2.3 |\r\n| NFR-3, AD-2 | 3 | 3.1, 3.2 |\r\n| AD-4 | 3 | 3.2, 3.3 |\r\n| UX-DR1–6 | 1, 2 | 1.1, 2.1 |\r\n| FR-9 | 4 | 4.1 |\r\n| FR-10 | 4 | 4.2 |\r\n| FR-11 | 4 | 4.3 |\r\n| FR-12 | 4 | 4.4 |\r\n| FR-13 | 4 | 4.5 |\r\n| AD-8–AD-11 | 4 | 4.1–4.5 |\r\n| NFR-6 | 4 | 4.2 |\r\n\r\n## Epic List\r\n\r\n1. **Epic 1: Secure operator entry** — Operator can sign in, recover access, and meet legal/branding requirements on Login.\r\n2. **Epic 2: Landing hub orientation** — Authenticated operator sees Fleet 360 value prop and enters Devices, Sites, or Users.\r\n3. **Epic 3: Protected navigation shell** — Session guard and domain route shells follow architecture spine.\r\n4. **Epic 4: Authenticated app chrome** — Navbar and profile menu for settings, theme, and sign out on all protected routes.\r\n\r\n---\r\n\r\n## Epic 1: Secure operator entry\r\n\r\nOperators can authenticate through a Figma-faithful Login screen with validation, legal notice, ACL branding, and a path to password recovery.\r\n\r\n### Story 1.1: Login screen UI and validation (FR-1, FR-4, FR-8, UX-DR1, UX-DR4)\r\n\r\nAs an **Operator**,\r\nI want a Login screen that matches the approved design with working form validation,\r\nSo that I can enter credentials confidently and understand legal terms before signing in.\r\n\r\n**Acceptance Criteria:**\r\n\r\n**Given** I am on `/login` at 1366×768 viewport  \r\n**When** the page loads  \r\n**Then** I see Fleet 360 logo, email/password fields with labels, Login button, legal copy, and ACL “Powered by” footer using assets from `src/assets/fleet360/`  \r\n**And** empty submit shows validation feedback and invalid email format is rejected before submit  \r\n\r\n**Given** I focus the form  \r\n**When** I tab through controls  \r\n**Then** focus order is email → password → Forgot Password → Login → legal links  \r\n\r\n### Story 1.2: Forgot password entry (FR-3)\r\n\r\nAs an **Operator**,\r\nI want to open Forgot Password from Login,\r\nSo that I can start recovering access without contacting support.\r\n\r\n**Acceptance Criteria:**\r\n\r\n**Given** I am on `/login`  \r\n**When** I activate “Forgot Password?”  \r\n**Then** I navigate to `/forgot-password`  \r\n**And** the page explains next steps (email sent or MVP stub message per product decision)  \r\n\r\n### Story 1.3: Authenticate and redirect (FR-2)\r\n\r\nAs an **Operator**,\r\nI want successful login to take me to the Landing hub,\r\nSo that I can choose where to work next.\r\n\r\n**Acceptance Criteria:**\r\n\r\n**Given** valid credentials (API or approved dev stub behind feature flag)  \r\n**When** I submit Login  \r\n**Then** a Session is established per AD-3 and I am navigated to `/home`  \r\n**And** invalid credentials show one generic error with no field-specific leak  \r\n\r\n### Story 1.4: Block unauthenticated hub access (FR-2, FR-7, AD-2)\r\n\r\nAs the **system**,\r\nI want protected routes to require a Session,\r\nSo that operators cannot view the hub without signing in.\r\n\r\n**Acceptance Criteria:**\r\n\r\n**Given** I have no Session  \r\n**When** I visit `/home`, `/profile`, `/devices`, `/sites`, or `/users`  \r\n**Then** I am redirected to `/login`  \r\n\r\n**Given** I have a valid Session  \r\n**When** I refresh `/home`  \r\n**Then** I remain on Landing and am not sent to Login  \r\n\r\n---\r\n\r\n## Epic 2: Landing hub orientation\r\n\r\nAuthenticated operators see the Fleet 360 welcome experience and can navigate to each domain area.\r\n\r\n### Story 2.1: Landing hero and hub layout (FR-5, UX-DR2, UX-DR3, UX-DR6)\r\n\r\nAs an **Operator**,\r\nI want the Landing hub to match the approved Figma layout and copy,\r\nSo that I understand product value and available areas.\r\n\r\n**Acceptance Criteria:**\r\n\r\n**Given** I am authenticated on `/home`  \r\n**When** the page renders  \r\n**Then** I see color Fleet 360 logo, “Welcome to Fleet 360”, body copy, and three cards (Devices, Sites, Users) with descriptions and pill CTAs per design export  \r\n**And** hub icons load from `src/assets/fleet360/icon-*.svg`  \r\n\r\n### Story 2.2: Hub card navigation (FR-6)\r\n\r\nAs an **Operator**,\r\nI want each hub card CTA to open the correct domain route,\r\nSo that I can start work in Devices, Sites, or Users.\r\n\r\n**Acceptance Criteria:**\r\n\r\n**Given** I am on `/home`  \r\n**When** I click Manage Devices / Manage Sites / Manage Users  \r\n**Then** I navigate to `/devices`, `/sites`, or `/users` respectively  \r\n**And** browser Back returns me to `/home` with Session intact  \r\n\r\n### Story 2.3: Session expiry handling on hub (FR-7)\r\n\r\nAs an **Operator**,\r\nI want clear behavior when my session expires,\r\nSo that I am not left on a broken hub screen.\r\n\r\n**Acceptance Criteria:**\r\n\r\n**Given** my Session has expired  \r\n**When** I load or refresh `/home`  \r\n**Then** I am redirected to `/login` with an optional message  \r\n\r\n---\r\n\r\n## Epic 3: Protected navigation shell\r\n\r\nApplication routing and placeholders follow the architecture spine and keep auth logic out of pages.\r\n\r\n### Story 3.1: Canonical route table (AD-1)\r\n\r\nAs a **developer**,\r\nI want a single route map in the app shell,\r\nSo that URLs match the architecture spine and PRD.\r\n\r\n**Acceptance Criteria:**\r\n\r\n**Given** the app boots  \r\n**When** I visit `/`  \r\n**Then** I am redirected to `/login`  \r\n**And** routes exist for `/login`, `/home`, `/forgot-password`, `/profile`, `/devices`, `/sites`, `/users` as documented in AD-1  \r\n\r\n### Story 3.2: Auth module and session guard (AD-2, AD-3, AD-4, NFR-3)\r\n\r\nAs a **developer**,\r\nI want session checks in `src/auth/` (and API client in `src/api/` when wired),\r\nSo that pages stay presentation-only and tokens are stored safely.\r\n\r\n**Acceptance Criteria:**\r\n\r\n**Given** `src/auth/` exists with guard helper used by router  \r\n**When** protected routes render  \r\n**Then** Login page does not import fetch logic for token storage in localStorage  \r\n**And** production path documents httpOnly cookie integration point  \r\n\r\n### Story 3.3: Domain placeholder shells\r\n\r\nAs an **Operator**,\r\nI want each domain route to show a minimal shell with title and back link,\r\nSo that hub CTAs never dead-end before Phase 2 modules.\r\n\r\n**Acceptance Criteria:**\r\n\r\n**Given** I am authenticated  \r\n**When** I open `/devices`, `/sites`, or `/users`  \r\n**Then** I see a titled shell with one-line description and link back to `/home`  \r\n\r\n---\r\n\r\n## Epic 4: Authenticated app chrome\r\n\r\nOperators see consistent top navigation on protected pages and can manage account preferences or end their session from a profile menu.\r\n\r\n### Story 4.1: Authenticated layout and app navbar (FR-9, AD-8)\r\n\r\nAs an **Operator**,\r\nI want a navbar on every authenticated screen,\r\nSo that I always have access to account actions while working in the hub or domain shells.\r\n\r\n**Acceptance Criteria:**\r\n\r\n- [x] **Given** I am authenticated on `/home`, `/devices`, `/sites`, or `/users` **When** the page loads **Then** I see the app navbar above the page content.\r\n- [x] **Given** I am on `/login` or `/forgot-password` **When** the page loads **Then** the app navbar is not shown.\r\n- [x] **Given** `AuthenticatedLayout` wraps protected routes **When** I navigate between protected routes **Then** the navbar persists without full-page remount flicker.\r\n\r\n### Story 4.2: Profile menu UI and accessibility (FR-10, AD-10, NFR-6)\r\n\r\nAs an **Operator**,\r\nI want a profile menu in the navbar,\r\nSo that I can reach settings, theme, and sign out without hunting for controls.\r\n\r\n**Acceptance Criteria:**\r\n\r\n- [x] **Given** I am authenticated **When** I activate the profile control **Then** a menu opens with **Profile settings**, **Theme**, and **Sign out**.\r\n- [x] **Given** the menu is open **When** I press Escape or activate outside **Then** the menu closes and focus returns to the profile control.\r\n- [x] **Given** the menu is open **When** I use keyboard navigation **Then** I can reach each menu item and activate it.\r\n\r\n### Story 4.3: Profile settings page (FR-11, AD-10)\r\n\r\nAs an **Operator**,\r\nI want a profile settings screen,\r\nSo that I can confirm which account I am signed in as.\r\n\r\n**Acceptance Criteria:**\r\n\r\n- [x] **Given** I choose **Profile settings** from the menu **When** navigation completes **Then** I am on `/profile` behind the session guard.\r\n- [x] **Given** I am on `/profile` **When** the page renders **Then** I see my signed-in email or display label from the session (no password fields).\r\n- [x] **Given** I have no Session **When** I visit `/profile` **Then** I am redirected to `/login`.\r\n\r\n### Story 4.4: Theme preference (FR-12, AD-9, AD-6)\r\n\r\nAs an **Operator**,\r\nI want to change the application theme,\r\nSo that the UI matches my lighting preference and stays consistent across pages.\r\n\r\n**Acceptance Criteria:**\r\n\r\n- [x] **Given** I am authenticated **When** I use **Theme** from the profile menu (or on `/profile`) **Then** the theme updates immediately on authenticated pages using `fleet-tokens.css`.\r\n- [x] **Given** I set a theme **When** I reload the browser **Then** the same theme is applied (`fleet360.theme` in `localStorage`).\r\n- [x] **Given** I sign in **When** credentials are stored **Then** no password or long-lived auth token is written to `localStorage` (AD-3).\r\n\r\n### Story 4.5: Sign out (FR-13, AD-11)\r\n\r\nAs an **Operator**,\r\nI want to sign out from the profile menu,\r\nSo that the next person using this workstation cannot access my session.\r\n\r\n**Acceptance Criteria:**\r\n\r\n- [x] **Given** I am authenticated **When** I choose **Sign out** **Then** my Session is cleared via `src/auth/` and I land on `/login`.\r\n- [x] **Given** I signed out **When** I visit `/home`, `/profile`, `/devices`, `/sites`, or `/users` **Then** I am redirected to `/login`.\r\n- [x] **Given** the profile menu is open **When** I activate **Sign out** **Then** no extra confirmation step is required for MVP.\r\n\r\n---\r\n\r\n## Validation Summary (Step 4)\r\n\r\n- **FR coverage:** FR-1 through FR-13 mapped to stories; no orphan FRs.\r\n- **NFR / AD coverage:** AD-1–AD-11 addressed via Epics 1–4; SSO and real Devices module deferred per spine.\r\n- **Dependencies:** Epic 4 builds on Epic 3 (`AuthenticatedLayout`, session guard). Stories 4.1–4.5 implemented in `src/layouts/`, `src/components/`, `src/pages/ProfileSettings.jsx`, `src/theme/`, `src/auth/signOut.js`.\r\n- **Delivery:** Epics 1–4 acceptance criteria satisfied in repo; re-validate on regression before release.\r\n"},{"id":"_acl-output_planning-artifacts_implementation-readiness-report-2026-09-16_md","folderPath":"_acl-output/planning-artifacts","filename":"implementation-readiness-report-2026-09-16.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.374Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-16T06:56:49.205Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\nstepsCompleted:\r\n  - step-01-document-discovery\r\n  - step-02-prd-analysis\r\n  - step-03-epic-coverage-validation\r\n  - step-04-ux-alignment\r\n  - step-05-epic-quality-review\r\n  - step-06-final-assessment\r\nassessor: ACL Implementation Readiness (automated)\r\ninputDocuments:\r\n  - _acl-output/planning-artifacts/prds/prd-fleets360-2026-09-16/prd.md\r\n  - _acl-output/planning-artifacts/prds/prd-fleets360-2026-09-16/addendum.md\r\n  - _acl-output/planning-artifacts/architecture/architecture-fleets360-2026-09-16/ARCHITECTURE-SPINE.md\r\n  - _acl-output/planning-artifacts/ux-designs/ux-fleets360-2026-09-16/DESIGN.md\r\n  - _acl-output/planning-artifacts/ux-designs/ux-fleets360-2026-09-16/EXPERIENCE.md\r\n  - _acl-output/planning-artifacts/epics.md\r\n  - _acl-output/planning-artifacts/briefs/brief-fleets360-2026-09-16/brief.md\r\ncreated: \"2026-09-16\"\r\nupdated: \"2026-09-16\"\r\n---\r\n\r\n# Implementation Readiness Assessment Report\r\n\r\n**Date:** 2026-09-16  \r\n**Project:** fleets360 (Fleet 360 Login + Landing MVP)\r\n\r\n## 1. Document Discovery\r\n\r\n| Artifact | Path | Status | Notes |\r\n| --- | --- | --- | --- |\r\n| PRD | `prds/prd-fleets360-2026-09-16/prd.md` | Approved | FR-1–FR-8, UJ-1–3 |\r\n| PRD addendum | `prds/.../addendum.md` | Approved* | Routes, Figma nodes, auth notes |\r\n| Architecture spine | `architecture/.../ARCHITECTURE-SPINE.md` | Approved | AD-1–AD-7 |\r\n| UX DESIGN | `ux-designs/.../DESIGN.md` | Approved | Tokens, Figma refs |\r\n| UX EXPERIENCE | `ux-designs/.../EXPERIENCE.md` | Approved | IA, routes, flows |\r\n| Epics & stories | `epics.md` | Approved | 3 epics, 10 stories |\r\n| Brief | `briefs/.../brief.md` | Approved | Context only |\r\n\r\n\\*Confirm addendum frontmatter in Markdown Studio if still shown as In Review.\r\n\r\n**Duplicates:** None (no sharded vs whole conflicts).  \r\n**Missing:** None required for this MVP slice.\r\n\r\n## 2. PRD Analysis\r\n\r\n**Functional requirements:** FR-1 through FR-8 (Login, Landing hub, ACL branding).  \r\n**Non-functional:** Accessibility on Login; HTTPS; session security; SM metrics in PRD §7.  \r\n**Open questions (PRD §8):** Auth backend (mock vs API), Landing vs Dashboard default, CTA intent, customer branding, HVAC vertical.\r\n\r\n**Assessment:** PRD is complete for the declared MVP scope. Open questions are documented and do not block sprint planning if stories allow stub/MVP paths.\r\n\r\n## 3. Epic Coverage Validation\r\n\r\n| FR | Covered in epics.md | Stories |\r\n| --- | --- | --- |\r\n| FR-1 | Yes | 1.1 |\r\n| FR-2 | Yes | 1.3, 1.4 |\r\n| FR-3 | Yes | 1.2 |\r\n| FR-4 | Yes | 1.1 |\r\n| FR-5 | Yes | 2.1 |\r\n| FR-6 | Yes | 2.2 |\r\n| FR-7 | Yes | 1.4, 2.3 |\r\n| FR-8 | Yes | 1.1 |\r\n\r\n**Gaps:** None — all PRD FRs appear in the FR Coverage Map and story acceptance criteria.\r\n\r\n**NFR / AD coverage:** NFR-3, AD-2, AD-4 assigned to Epic 3 (stories 3.1–3.2). UX-DR1–6 mapped to 1.1 and 2.1.\r\n\r\n## 4. UX Alignment\r\n\r\n**UX ↔ PRD**\r\n\r\n- Routes and journeys align (`/login`, `/home`, domain shells).\r\n- **Resolved inconsistency:** PRD FR-5 text references “Get Started” / “Learn More”; Figma export and implemented UI use **Manage Devices / Sites / Users**. Epics and UX-DR6 follow design export — **no PRD change required** if product accepts design as source of truth.\r\n\r\n**UX ↔ Architecture**\r\n\r\n- AD-5 (Figma assets in `src/assets/fleet360/`) matches UX manifest.\r\n- AD-6 (`fleet-tokens.css`) matches DESIGN.md tokens.\r\n- AD-1 route table matches EXPERIENCE.md IA.\r\n- Responsive hub rule (900px) in EXPERIENCE — story 2.1 should verify in QA; not in architecture Deferred.\r\n\r\n**Brownfield:** Login/Landing UI largely implemented; readiness is about **closing AD-2 session guard** and **auth module** per spine.\r\n\r\n## 5. Epic Quality Review\r\n\r\n| Check | Result |\r\n| --- | --- |\r\n| User-value epics | **Pass** — Epics 1–2 are operator-facing; Epic 3 is shell/guard (borderline but justified for MVP routing) |\r\n| Epic independence | **Pass** — Epic 2 usable after Epic 1 auth path; Epic 3 can land in parallel with 1.3/1.4 |\r\n| Forward story dependencies | **Pass** — No story requires a later story in the same epic |\r\n| Story sizing | **Pass** — Stories map to single dev-agent slices |\r\n| Violations | **Minor:** Story 3.1 persona is “developer” (technical framing). Consider reframing to operator/system outcome without blocking implementation |\r\n\r\n## 6. Summary and Recommendations\r\n\r\n### Overall Readiness Status\r\n\r\n**CONDITIONALLY READY** — Planning artifacts are aligned and traceable. Safe to proceed to **`acl-sprint-planning`** and **`acl-quick-dev`** for remaining stories, with the conditions below.\r\n\r\n### Critical Issues Requiring Immediate Action\r\n\r\nNone that block **starting** Phase 4 for MVP UI/auth work.\r\n\r\n### Medium Issues (address during Sprint 1)\r\n\r\n1. **Implement AD-2** — Session guard on `/home`, `/devices`, `/sites`, `/users` (Stories 1.4, 3.2); code today navigates on submit without guard.\r\n2. **Auth contract** — Decide mock vs real API (PRD §8, spine Deferred); document in sprint plan before Story 1.3 production hardening.\r\n3. **Forgot password** — Story 1.2 stub vs full flow; align with product before release.\r\n4. **Terms/Privacy URLs** — FR-4 placeholders (`#terms`); replace before production deploy.\r\n\r\n### Low Issues\r\n\r\n1. Approve **brief/PRD addendums** in Markdown Studio if still In Review (global gate hygiene).\r\n2. Reframe Story 3.1 away from “developer” persona in a future epics edit (optional).\r\n\r\n### Recommended Next Steps\r\n\r\n1. Run **`acl-sprint-planning`** — order stories 1.4 → 3.2 → 1.3 → 1.2 → 2.3 (guard + auth before relying on hub in prod).\r\n2. Run **`acl-quick-dev`** on Story **3.2** and **1.4** first.\r\n3. Re-run readiness or **`acl-check-implementation-readiness`** update after auth API decision is recorded in PRD or spine Deferred.\r\n\r\n### Final Note\r\n\r\nThis assessment found **0 blocking planning gaps**, **4 medium implementation/contract items**, and **2 low housekeeping items** across PRD, UX, architecture, and epics. You may proceed to sprint planning and development while tracking medium items in the sprint backlog.\r\n"},{"id":"_acl-output_planning-artifacts_prds_prd-fleets360-2026-09-16_prd_md","folderPath":"_acl-output/planning-artifacts/prds/prd-fleets360-2026-09-16","filename":"prd.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-24T05:35:15.817Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-16T09:33:27.900Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: Fleet 360\ncreated: \"2026-09-16\"\nupdated: \"2026-09-16\"\nsources:\n  - _acl-output/planning-artifacts/briefs/brief-fleets360-2026-09-16/brief.md\n  - _acl-output/planning-artifacts/briefs/brief-fleets360-2026-09-16/addendum.md\ndesign:\n  figma_file: FE12zdGPJ4ROng1HfhL55c\n  login_node: \"1228:11322\"\n  landing_node: \"227:3884\"\n---\n\nupdated new\n\n# PRD: Fleet 360\n*Working title — Fleet 360 (web). MVP slice: authenticated entry and post-login hub per approved product brief.*\n\n## 0. Document Purpose\n\nThis PRD is for product, engineering, UX, and QA implementing the **first shippable web slice** of Fleet 360: **Login**, **Landing hub**, and **authenticated app chrome** (navbar with profile menu). It builds on the approved product brief and addendum (Figma Fleet-360_BK, Web canvas). Vocabulary is fixed in §3 Glossary. Functional requirements use global IDs (FR-1…). Assumptions are tagged inline and listed in §9.\n\nDownstream UX (`acl-ux`) should treat Figma nodes `1228:11322` (Login) and `227:3884` (Landing) as the visual source of truth for Login/Landing. Navbar and profile menu may extend hub tokens when no dedicated Figma node is named in the brief. Architecture and epics must not expand scope into device cards, dashboards, or telemetry unless this PRD is updated.\n\n## 1. Vision\n\nFleet 360 is a web control surface for organizations that operate equipment across many physical **Sites**. Operators need one place to sign in, see what the product offers, and enter the **Devices**, **Sites**, or **Users** areas without juggling separate tools.\n\nThe MVP delivers the **front door**: credential-based **Login**, then an authenticated **Landing hub** that states the product promise—complete visibility into data and control over insights—and routes users into the three domains. **Powered by ACL Digital** appears on Login as platform attribution; customer-facing brand is **Fleet 360**.\n\nImplementation target is a **desktop-first web** experience at **1366×768** (per design), in the existing `fleets360` React + Vite codebase, which is currently a starter with no auth or hub UI.\n\n## 2. Target User\n\n### 2.1 Jobs To Be Done\n\n- **Sign in securely** so only authorized people reach operational data and actions.\n- **Understand what Fleet 360 offers** immediately after auth (visibility, control, real-time analytics positioning).\n- **Choose where to work**—devices, sites, or user access—without hunting in a menu.\n- **Recover access** when credentials are forgotten, without filing a support ticket for the common case. `[ASSUMPTION: self-service reset flow exists backend-side or is stubbed with clear messaging in MVP.]`\n- **Admins (secondary):** eventually assign **roles per Site** via the Users path; MVP only requires routing to that area, not full RBAC UI.\n\n### 2.2 Non-Users (v1)\n\n- Anonymous visitors (no public marketing site in scope).\n- Mobile-native users (responsive behavior may follow design tokens later; MVP validates desktop layout).\n- End customers configuring SSO IdP (SSO not in v1 UI). `[ASSUMPTION]`\n\n### 2.3 Key User Journeys\n\n- **UJ-1. Marcus signs in before his morning walkthrough.**\n  - **Persona + context:** Marcus, site operations lead, uses a desktop browser at the facility office.\n  - **Entry state:** Unauthenticated; bookmarked Login URL.\n  - **Path:** Opens Login → enters email and password → reads Terms/Privacy notice → taps Login → lands on Landing hub.\n  - **Climax:** Landing shows “Welcome to Fleet 360” and three domain cards; Marcus knows where to go next.\n  - **Resolution:** Marcus clicks **Get Started** on Devices (primary funnel) or **Learn More** on Sites/Users.\n  - **Edge case:** Wrong password → inline error, remain on Login, no partial session.\n\n- **UJ-2. Priya returns after a week away.**\n  - **Persona + context:** Priya, regional admin, forgot password.\n  - **Entry state:** Unauthenticated on Login.\n  - **Path:** Clicks **Forgot Password?** → completes reset flow `[ASSUMPTION: email link or stub screen with success path defined in implementation]`.\n  - **Climax:** Can set or confirm new credentials and reach Landing.\n  - **Resolution:** Same as UJ-1 on Landing.\n\n- **UJ-3. James orients a new teammate (hub only).**\n  - **Persona + context:** James, team lead, already authenticated.\n  - **Entry state:** Lands on Landing after login.\n  - **Path:** Reads value proposition copy → scans Devices / Sites / Users cards and CTAs.\n  - **Climax:** James uses **Learn More** on Users to explain access model (“roles per site”).\n  - **Resolution:** Navigates to placeholder or future Users module route; MVP may show “coming soon” only if explicitly agreed—default is route stub with brief copy, not dead link.\n\n- **UJ-4. Marcus ends his shift and hands off the workstation.**\n  - **Persona + context:** Marcus, site operations lead, shared office desktop.\n  - **Entry state:** Authenticated on `/devices` after visiting the hub.\n  - **Path:** Opens profile menu in the app navbar → chooses **Sign out** → confirms redirect to **Login**.\n  - **Climax:** Protected routes are unreachable until Marcus signs in again.\n  - **Resolution:** Next operator sees Login, not Marcus’s session.\n  - **Alternate path:** Marcus opens profile menu → **Theme** toggles light/dark → preference persists after refresh; or **Profile settings** shows signed-in identity (email/display label) with room for future editable fields.\n\n## 3. Glossary\n\n- **Fleet 360** — Customer-facing product name on Landing and Login context.\n- **ACL Digital** — Platform builder; “Powered by” attribution on Login.\n- **Login** — Unauthenticated screen for email/password sign-in and legal notice.\n- **Landing hub** — First authenticated screen after successful Login; welcome hero plus three domain cards.\n- **Site** — A physical or logical location that groups **Devices** and scoped **Users** / roles.\n- **Device** — Operational asset managed in the Devices domain (e.g. HVAC/RTU in later Figma frames; not implemented in this MVP).\n- **User (domain)** — People and access management, including roles **per Site**.\n- **Operator** — Primary persona using Login and Landing to reach daily work.\n- **Session** — Authenticated browser state after successful Login until logout or expiry.\n- **App navbar** — Persistent top chrome on authenticated routes; hosts product identity and account affordances.\n- **Profile menu** — Dropdown from the navbar profile control; entries for profile settings, theme, and sign out.\n\n## 4. Features\n\n### 4.1 Authentication (Login)\n\n**Description:** Presents Fleet 360 entry with email and password fields, primary Login action, Forgot Password link, and mandatory legal copy. Visual treatment includes industrial operations imagery and ACL Digital footer. Realizes UJ-1, UJ-2. Hidden Figma layers (TotalView, Early Access, Remember Me) are **not** shipped unless product reopens them.\n\n**Functional Requirements:**\n\n#### FR-1: Email and password capture\n\nAn **Operator** can enter email and password on **Login** with labeled fields matching design (“Enter Email”, “Enter Password”).\n\n**Consequences (testable):**\n- Empty required fields block submit and show validation feedback.\n- Email field rejects obviously invalid formats before submit.\n- Password field masks input.\n\n#### FR-2: Authenticate and establish session\n\nAn **Operator** with valid credentials can submit **Login** and receive an authenticated **Session**, then be navigated to the **Landing hub**.\n\n**Consequences (testable):**\n- Invalid credentials return a generic failure message without revealing which field failed.\n- Successful login does not expose password in URL, logs, or client storage in plain text.\n- Unauthenticated users cannot access **Landing hub** routes (redirect to **Login**).\n\n#### FR-3: Forgot password entry point\n\nAn **Operator** can open **Forgot Password?** from **Login** and enter a recovery flow.\n\n**Consequences (testable):**\n- Link is keyboard-focusable and visible on desktop layout.\n- Recovery flow acknowledges submission (e.g. “check your email”) or documents MVP stub behavior in release notes.\n\n#### FR-4: Legal notice on Login\n\n**Login** displays copy that login implies agreement to **Terms and Conditions** and **Privacy Notice**, with links or placeholders to those documents.\n\n**Consequences (testable):**\n- Notice is visible without scrolling on 1366×768 for the primary form layout.\n- Terms and Privacy targets resolve (URL or internal route); broken links fail QA.\n\n**Feature-specific NFRs:**\n- Accessibility: form labels associated with inputs; focus order email → password → actions.\n- Security: HTTPS in deployed environments; `[ASSUMPTION]` rate limiting on auth API handled server-side.\n\n### 4.2 Post-login hub (Landing)\n\n**Description:** After **Session** is established, shows hero “Welcome to” / “Fleet 360”, value proposition about visibility, control, and secure real-time analytics, and three cards: **Devices**, **Sites**, **Users** with designed CTAs. Realizes UJ-1, UJ-3.\n\n**Functional Requirements:**\n\n#### FR-5: Landing content fidelity\n\nAn authenticated **Operator** sees **Landing hub** copy and structure aligned with Figma `227:3884` (hero, body text, three cards with titles and descriptions).\n\n**Consequences (testable):**\n- Devices card includes CTA label **Get Started**.\n- Sites and Users cards include CTA label **Learn More**.\n- Fleet 360 wordmark/hero treatment matches design within reasonable implementation tolerance.\n\n#### FR-6: Domain navigation from cards\n\nAn **Operator** can activate each card’s CTA and navigate to a defined route for that domain.\n\n**Consequences (testable):**\n- Devices **Get Started** navigates to `/devices` or equivalent registered route.\n- Sites **Learn More** navigates to `/sites` (or equivalent).\n- Users **Learn More** navigates to `/users` (or equivalent).\n- Browser back from child route returns to **Landing hub** without destroying **Session** unless logout occurred.\n\n#### FR-7: Session persistence on Landing\n\nAn authenticated **Operator** refreshing **Landing hub** remains authenticated.\n\n**Consequences (testable):**\n- Refresh does not send user to **Login** while **Session** is valid.\n- Expired **Session** redirects to **Login** with optional message.\n\n**Notes:** `[NOTE FOR PM]` Clarify whether child routes are empty shells, marketing sub-pages, or blocked until Phase 2—default for MVP: routable shells with title + one-line description.\n\n### 4.3 Platform chrome and branding\n\n**Description:** Consistent Fleet 360 + ACL Digital presentation on Login; Fleet 360 emphasis on Landing.\n\n#### FR-8: ACL Digital attribution\n\n**Login** shows “Powered by” ACL Digital per design (`logo_acl_login`).\n\n**Consequences (testable):**\n- Attribution visible on Login at 1366×768.\n- Not required to duplicate on Landing unless design specifies.\n\n### 4.4 Authenticated app chrome (navbar and profile menu)\n\n**Description:** After **Session** is established, operators see a consistent **App navbar** on protected routes (`/home`, `/devices`, `/sites`, `/users`, and profile settings). **Login** and **Forgot Password** do not show the navbar. A **Profile menu** exposes account actions without leaving the current task context. Realizes UJ-4.\n\n**Functional Requirements:**\n\n#### FR-9: Navbar on protected routes\n\nAn authenticated **Operator** sees the **App navbar** on every protected route in the MVP route table.\n\n**Consequences (testable):**\n- Navbar is absent on `/login` and `/forgot-password`.\n- Navbar is present on `/home`, `/devices`, `/sites`, `/users`, and the profile settings route defined in architecture.\n- Navbar does not render for unauthenticated visitors (session guard unchanged).\n\n#### FR-10: Profile menu actions\n\nAn authenticated **Operator** can open the **Profile menu** from the navbar and choose **Profile settings**, **Theme**, or **Sign out**.\n\n**Consequences (testable):**\n- Menu opens and closes via pointer and keyboard; focus returns sensibly on dismiss.\n- Menu items are labeled consistently (“Profile settings”, “Theme”, “Sign out” or equivalent approved copy).\n- Activating an item performs the action associated with that item (FR-11, FR-12, FR-13).\n\n#### FR-11: Profile settings entry\n\nAn **Operator** who chooses **Profile settings** reaches a dedicated **Profile settings** view (page or modal) showing at least the signed-in identity (e.g. email from session).\n\n**Consequences (testable):**\n- View is reachable only when authenticated; unauthenticated access redirects to **Login**.\n- No password or long-lived secret is shown or stored in client-visible storage on this screen.\n- Editable profile fields beyond identity display are optional for MVP; if not implemented, UI states that extended profile editing is coming later.\n\n#### FR-12: Theme preference\n\nAn **Operator** can change application **Theme** (light and dark; system preference optional) from the **Profile menu** or from **Profile settings**.\n\n**Consequences (testable):**\n- Theme applies immediately across authenticated pages using shared design tokens.\n- Theme preference persists across page reload in the same browser profile without storing credentials.\n- Theme control does not break Login/Landing visual acceptance for routes that use hub tokens.\n\n#### FR-13: Sign out\n\nAn **Operator** can **Sign out** from the **Profile menu**, ending the **Session** and returning to **Login**.\n\n**Consequences (testable):**\n- After sign out, visiting `/home`, `/devices`, `/sites`, or `/users` redirects to **Login**.\n- Sign out clears client session state per architecture (no stale “authenticated” UI).\n- Sign out is reachable in one action from the open profile menu (no nested confirmation required unless security review mandates it).\n\n**Feature-specific NFRs:**\n- Accessibility: profile control is keyboard operable; menu supports arrow-key navigation and Escape to close; visible focus indicators.\n- Security: sign out must invalidate client session; no auth tokens left in plain localStorage (NFR-3 alignment).\n\n## 5. Non-Goals (Explicit)\n\n- Dashboards, device detail cards, RTU telemetry, set points, maps, Excel export (present later in Figma).\n- Self-serve registration / sign-up.\n- SSO, MFA, or social login in v1 UI.\n- TotalView / “Early Access” legacy branding.\n- Customer-specific OEM skins (e.g. Rheem copy off-canvas) without separate PRD.\n- Native mobile apps.\n- Full profile CRUD against a live user directory API.\n- Org-wide enforced theme policies or per-site branding skins.\n\n## 6. MVP Scope\n\n### 6.1 In Scope\n\n- **Login** UI and client-side validation; integration with auth API or agreed stub for demo.\n- **Landing hub** UI and navigation to three domain routes.\n- Session guard for authenticated routes.\n- Forgot Password entry (full or stubbed backend).\n- Terms & Privacy links.\n- Figma-aligned desktop layout for Login and Landing.\n- **App navbar** on authenticated routes with **Profile menu** (FR-9–FR-13).\n- **Profile settings** identity view; **Theme** toggle with persistence; **Sign out**.\n\n### 6.2 Out of Scope for MVP\n\n- Full Devices/Sites/Users feature modules — routes may be placeholders (reason: brief scope).\n- Real-time analytics data pipelines (reason: promise is positioning copy only on Landing).\n- Role assignment UI (reason: Users card routes ahead of RBAC implementation).\n- SSO (reason: not in design frames). `[NOTE FOR PM]` Revisit when enterprise pilot named.\n\n## 7. Success Metrics\n\n**Primary**\n\n- **SM-1:** ≥95% of successful logins reach **Landing hub** within one navigation step. Validates FR-2.\n- **SM-2:** 100% of QA cases show three domain cards with correct CTA labels. Validates FR-5.\n\n**Secondary**\n\n- **SM-3:** Median time from Login submit to interactive Landing ≤30s on staging. `[ASSUMPTION]` Validates FR-2, FR-5.\n- **SM-4:** Forgot Password path reachable in ≤2 clicks from Login. Validates FR-3.\n- **SM-5:** 100% of QA authenticated-route cases show navbar with working profile menu. Validates FR-9, FR-10.\n- **SM-6:** Sign out from profile menu blocks protected routes in 100% of QA cases. Validates FR-13.\n\n**Counter-metrics (do not optimize)**\n\n- **SM-C1:** Login success rate without fraud checks weakened—do not bypass lockout or CAPTCHA policies to inflate SM-1.\n\n## 8. Open Questions\n\n1. Auth backend: existing IdP/API vs. temporary mock for UI-only sprint?\n2. Post-login default: always **Landing hub**, or redirect power users to Dashboard when that exists?\n3. **Get Started** vs **Learn More**—product intent for funnel vs. label parity?\n4. Contracted end customer branding vs. ACL Digital-only shell?\n5. HVAC/RTU as first vertical for copy in placeholder routes?\n6. Canonical path for **Profile settings** (`/profile`, `/settings/profile`, or modal-only)—confirm in architecture spine.\n7. Theme modes: light/dark only vs. include **system** preference in MVP.\n\n## 9. Assumptions Index\n\n- Email/password sufficient for v1; no SSO (§2.2, FR-2).\n- Primary users are facility/fleet operators; HVAC/RTU inferred from later Figma, not Login/Landing copy (brief).\n- Forgot password can be stubbed with clear UX if backend not ready (FR-3).\n- Child domain routes may be shells until Phase 2 (FR-6 note).\n- Desktop 1366×768 is the acceptance viewport (brief).\n- Session expiry behavior follows standard token/session TTL `[ASSUMPTION: define TTL in architecture]`.\n- Navbar/profile UI exte
