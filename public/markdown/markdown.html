nds hub design tokens when Figma does not specify a frame (brief addendum 2026-09-16).\n- Theme preference may use non-secret browser storage; credentials remain out of localStorage (FR-12, NFR-3).\n- Profile settings MVP is read-only identity unless backend profile API exists (FR-11).\n"},{"id":"_acl-output_planning-artifacts_ux-designs_ux-fleets360-2026-09-16_DESIGN_md","folderPath":"_acl-output/planning-artifacts/ux-designs/ux-fleets360-2026-09-16","filename":"DESIGN.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.360Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-16T06:43:37.634Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\nname: Fleet 360\r\ndescription: Web login and landing hub — Figma Fleet-360_BK Web canvas (nodes 1228:11322, 227:3884).\r\ncreated: \"2026-09-16\"\r\nupdated: \"2026-09-16\"\r\ncolors:\r\n  primary: '#E50026'\r\n  navy: '#264072'\r\n  neutral-dark: '#1E2A2C'\r\n  neutral-30: '#515D6D'\r\n  input-border: '#AFC3BC'\r\n  white: '#FFFFFF'\r\ntypography:\r\n  body:\r\n    fontFamily: 'Roboto'\r\n    fontSize: 16px\r\n    fontWeight: '400'\r\n    lineHeight: '24px'\r\n  label:\r\n    fontFamily: 'Roboto'\r\n    fontSize: 16px\r\n    fontWeight: '400'\r\n    lineHeight: '20px'\r\n  welcome:\r\n    fontFamily: 'Inter'\r\n    fontSize: 24px\r\n    fontWeight: '400'\r\n    lineHeight: '24px'\r\n  hero-title:\r\n    fontFamily: 'Roboto'\r\n    fontSize: 32px\r\n    fontWeight: '700'\r\n    lineHeight: '24px'\r\n  card-title:\r\n    fontFamily: 'Roboto'\r\n    fontSize: 20px\r\n    fontWeight: '600'\r\n    lineHeight: '28px'\r\nrounded:\r\n  sm: 6px\r\n  pill: 100px\r\nspacing:\r\n  login-panel-width: 327px\r\n  card-icon-gap: 24px\r\ncomponents:\r\n  button-primary:\r\n    background: '{colors.primary}'\r\n    foreground: '{colors.white}'\r\n    radius: '{rounded.sm}'\r\n    height: 48px\r\n  button-pill:\r\n    background: '{colors.primary}'\r\n    foreground: '{colors.white}'\r\n    radius: '{rounded.pill}'\r\n  input:\r\n    border: '{colors.input-border}'\r\n    radius: '{rounded.sm}'\r\n    height: 48px\r\n---\r\n\r\n## Brand & Style\r\n\r\nFleet 360 is an operations web product: industrial credibility on Login (hero photography + deep blue gradient), clarity and approachability on Landing (color wordmark + neutral body on white, hub on slate panel). ACL Digital appears only as “Powered by” on Login.\r\n\r\nSource: [Figma Fleet-360_BK](https://www.figma.com/design/FE12zdGPJ4ROng1HfhL55c/Fleet-360_BK--1-?node-id=104-7811).\r\n\r\n## Colors\r\n\r\n- **Primary red** `{colors.primary}` — Login CTA, hub card pills.\r\n- **Navy** `{colors.navy}` — Landing welcome headline.\r\n- **Neutral dark** `{colors.neutral-dark}` — Body copy on white.\r\n- **Neutral 30** `{colors.neutral-30}` — Landing hub band background.\r\n- **Login gradient** — `linear-gradient(-90deg, …)` over hero image (see `fleet-tokens.css`).\r\n\r\n## Typography\r\n\r\nRoboto for UI and hub; Inter for “Welcome to” line. No decorative fonts.\r\n\r\n## Layout & Spacing\r\n\r\n- **Viewport reference:** 1366×768 (desktop-first).\r\n- **Login:** Left column form `{spacing.login-panel-width}`; full-bleed hero + gradient right.\r\n- **Landing:** Hero row (logo + copy); fixed-height hub band 272px with three 282px card columns.\r\n\r\n## Components\r\n\r\nExported assets live in `src/assets/fleet360/` (see `imports/figma-asset-manifest.md`). Use SVG logos and icons from Figma export; do not redraw.\r\n\r\n## Do's and Don'ts\r\n\r\n- **Do** use committed Figma exports for logos and 48×48 hub icons.\r\n- **Do** keep CTA labels from design (“Manage Devices”, not generic “Get Started” on implemented build).\r\n- **Don't** ship TotalView / Early Access legacy layers from hidden Figma groups.\r\n"},{"id":"_acl-output_planning-artifacts_ux-designs_ux-fleets360-2026-09-16_EXPERIENCE_md","folderPath":"_acl-output/planning-artifacts/ux-designs/ux-fleets360-2026-09-16","filename":"EXPERIENCE.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.326Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-16T06:43:42.386Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\ntitle: Fleet 360 Experience\r\ncreated: \"2026-09-16\"\r\nupdated: \"2026-09-16\"\r\nsources:\r\n  - _acl-output/planning-artifacts/prds/prd-fleets360-2026-09-16/prd.md\r\ndesign_ref: DESIGN.md\r\n---\r\n\r\n# Fleet 360 — Login & Landing Experience\r\n\r\n## Foundation\r\n\r\n- **Form factor:** Desktop web (1366×768 reference), React 19 + Vite, CSS modules per page.\r\n- **Visual identity:** `{design_ref}` tokens — primary `{colors.primary}`, hub background `{colors.neutral-30}`.\r\n\r\n## Information Architecture\r\n\r\n| Route | Screen | Figma node |\r\n| --- | --- | --- |\r\n| `/login` | Login | `1228:11322` |\r\n| `/home` | Landing hub | `227:3884` |\r\n| `/forgot-password` | Password recovery (shell) | — |\r\n| `/devices`, `/sites`, `/users` | Domain shells | — |\r\n\r\n## Voice and Tone\r\n\r\n- **Login:** Direct, compliant (“By clicking login…”). White on blue; confident operations product.\r\n- **Landing:** Aspirational but concrete — visibility, control, real-time analytics.\r\n\r\n## Component Patterns\r\n\r\n- **Text fields:** Label above, 48px height, `{components.input}` border.\r\n- **Primary button:** Full-width on Login; pill on hub cards.\r\n- **Hub card:** 48px icon + title + description + pill CTA.\r\n\r\n## State Patterns\r\n\r\n- **Login validation:** Block submit if email/password empty; show native validation.\r\n- **Auth (MVP):** Successful submit navigates to `/home` (stub session).\r\n- **Errors:** Invalid credentials — inline message (future FR-2).\r\n\r\n## Interaction Primitives\r\n\r\n- Forgot Password → `/forgot-password`.\r\n- Hub CTAs → respective module routes.\r\n- Legal links → placeholder anchors until legal URLs exist.\r\n\r\n## Accessibility Floor\r\n\r\n- Visible labels on all inputs; focusable links and buttons.\r\n- Icon images on hub use `alt=\"\"` with descriptive adjacent text.\r\n- Target contrast: white on `{colors.neutral-30}` and `{colors.primary}` per design.\r\n\r\n## Key Flows\r\n\r\n**UJ-1 Marcus signs in** — `/login` → submit → `/home` with three cards visible.\r\n\r\n**UJ-3 James orients teammate** — `/home` → read copy → **Manage Users** → `/users` shell.\r\n\r\n## Responsive & Platform\r\n\r\n- Hub stacks cards below 900px width; Login panel stays left-weighted with full-bleed background.\r\n"},{"id":"_acl-output_planning-artifacts_ux-designs_ux-fleets360-2026-09-16_imports_figma-asset-manifest_md","folderPath":"_acl-output/planning-artifacts/ux-designs/ux-fleets360-2026-09-16/imports","filename":"figma-asset-manifest.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-22T07:56:19.373Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-16T06:43:52.215Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\n---\r\n\r\n# Figma asset manifest — committed copies\r\n\r\nFile: `FE12zdGPJ4ROng1HfhL55c`  \r\nExtracted via Figma MCP `get_design_context` + `download_assets` on 2026-09-16.\r\n\r\n| Repo path | Usage | Figma source |\r\n| --- | --- | --- |\r\n| `src/assets/fleet360/login-hero.png` | Login background photo | MCP asset c77ade72… |\r\n| `src/assets/fleet360/login-mask.svg` | Mask reference (optional) | MCP asset 499698ad… |\r\n| `src/assets/fleet360/logo-fleet360-login.svg` | Login wordmark (light) | node 4003:14129 |\r\n| `src/assets/fleet360/logo-acl-digital.svg` | Powered by ACL | node 4045:14223 |\r\n| `src/assets/fleet360/logo-fleet360-landing.svg` | Landing color logo | node 4003:14139 |\r\n| `src/assets/fleet360/icon-devices.svg` | Hub Devices 48×48 | node 227:3932 |\r\n| `src/assets/fleet360/icon-sites.svg` | Hub Sites 48×48 | node 227:3946 |\r\n| `src/assets/fleet360/icon-users.svg` | Hub Users 48×48 | node 227:3962 |\r\n\r\nRemote URLs expire in ~7 days; always use repo paths for builds.\r\n"}];
